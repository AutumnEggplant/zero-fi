<svg viewBox="0 0 840 180" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg   { fill: #f4e8cc; }
    .note { fill: #5c2a0a; stroke: #9ccce8; stroke-width: 5; paint-order: stroke fill; }
    .name { fill: #5c2a0a; }
    .sub  { fill: #e8601a; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #1e0e04; }
      .note { fill: #f0c218; stroke: #1e0e04; stroke-width: 3; }
      .name { fill: #f4e8cc; }
    }
  </style>
  <defs>
    <clipPath id="s">
      <polygon points="0,0 840,0 840,10 0,55"/>
    </clipPath>
  </defs>
  <!-- Background -->
  <rect class="bg" width="840" height="180"/>
  <!-- Diagonal colour stripe — 4 palette bands -->
  <rect x="0"   y="0" width="210" height="55" fill="#5c2a0a" clip-path="url(#s)"/>
  <rect x="210" y="0" width="210" height="55" fill="#e8601a" clip-path="url(#s)"/>
  <rect x="420" y="0" width="210" height="55" fill="#f0c218" clip-path="url(#s)"/>
  <rect x="630" y="0" width="210" height="55" fill="#9ccce8" clip-path="url(#s)"/>
  <!-- Brand mark -->
  <text x="318" y="122" text-anchor="end"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="80" class="note">♪</text>
  <text x="328" y="122" text-anchor="start"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="56" font-weight="bold" class="name">Zero-Fi</text>
  <!-- Subtitle -->
  <text x="420" y="158" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="13" class="sub">Pi Zero W jukebox · AirPlay · Bluetooth · mpd · open WiFi AP</text>
</svg>
